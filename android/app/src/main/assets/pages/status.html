    <style id="theme-vars">
/* Source: Vercel Design Library (dl_builtin_vercel) — verbatim tokens.
   Project-local bridge: adds --vercel-radius-sm/md/lg semantic aliases
   derived from the Library's own --radius token, required by
   apply-html-head-contract.mjs. Library directory is read-only. */

:root {
  --vercel-background: var(--background, #ffffff);
  --vercel-foreground: var(--foreground, #0f172a);
  --vercel-card: var(--card, var(--background));
  --vercel-card-foreground: var(--card-foreground, var(--foreground));
  --vercel-popover: var(--popover, var(--card));
  --vercel-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --vercel-primary: var(--primary, #111827);
  --vercel-primary-foreground: var(--primary-foreground, #ffffff);
  --vercel-secondary: var(--secondary, var(--muted, var(--card)));
  --vercel-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --vercel-muted: var(--muted, var(--card));
  --vercel-muted-foreground: var(--muted-foreground, var(--foreground));
  --vercel-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --vercel-accent-foreground: var(--accent-foreground, var(--foreground));
  --vercel-destructive: var(--destructive, #ef4444);
  --vercel-destructive-foreground: var(--destructive-foreground, #ffffff);
  --vercel-border: var(--border, currentColor);
  --vercel-input: var(--input, var(--border));
  --vercel-ring: var(--ring, var(--primary));
  --vercel-chart-1: var(--chart-1, var(--primary));
  --vercel-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --vercel-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --vercel-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --vercel-chart-5: var(--chart-5, var(--foreground));
  --vercel-sidebar: var(--sidebar, var(--background));
  --vercel-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --vercel-sidebar-primary: var(--sidebar-primary, var(--primary));
  --vercel-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --vercel-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --vercel-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

  --vercel-radius-sm: calc(var(--radius) - 2px);
  --vercel-radius-md: var(--radius);
  --vercel-radius-lg: calc(var(--radius) + 4px);
  --vercel-radius-small: calc(var(--radius) - 2px);
  --vercel-radius-medium: var(--radius);
  --vercel-radius-large: calc(var(--radius) + 4px);

/* bg */
  --background: #ffffff;
  --card: #ffffff;
  --popover: #ffffff;
  --muted: #f5f5f5;

  /* text */
  --foreground: #0a0a0a;
  --card-foreground: #0a0a0a;
  --popover-foreground: #0a0a0a;
  --primary-foreground: #fafafa;
  --secondary-foreground: #171717;
  --muted-foreground: #858585;
  --accent-foreground: #171717;
  --destructive-foreground: #ffffff;

  /* accent */
  --primary: #121212;
  --secondary: #f5f5f5;
  --accent: #f5f5f5;
  --input: #e5e5e5;
  --ring: #0d0d0d;

  /* border */
  --border: #e8e8e8;

  /* success */
  --success-subtle: #14241a;
  --success: #62d178;
  --success-strong: #8be59c;
  --success-foreground: #0a0a0a;

  /* error */
  --error-subtle: #2a1517;
  --error: #ff6166;
  --error-strong: #ff9a9d;
  --error-foreground: #0a0a0a;

  /* status */

  /* chart */
  --chart-1: #91c5ff;
  --chart-2: #3a81f6;
  --chart-3: #2563ef;
  --chart-4: #1a4eda;
  --chart-5: #1f3fad;

  /* sidebar */
  --sidebar: #fafafa;
  --sidebar-foreground: #0a0a0a;
  --sidebar-primary: #171717;
  --sidebar-primary-foreground: #fafafa;
  --sidebar-accent: #f5f5f5;
  --sidebar-accent-foreground: #171717;
  --sidebar-border: #e5e5e5;
  --sidebar-ring: #a1a1a1;

  /* font */
  --font-sans: Geist, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Serif Display, ui-serif, serif;
  --font-mono: Geist Mono, ui-monospace, monospace;

  /* radius */
  --radius: 0.5rem;

  /* shadow */
  --shadow-x: 0;
  --shadow-y: 1px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;
  --shadow-2xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 1px 0px 0px rgba(0,0,0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 1px 0px 0px rgba(0, 0, 0, 0);

  /* typography */
  --tracking-normal: 0em;

  /* spacing */
  --spacing: 0.25rem;
}

.dark {

  /* font */

  /* radius */

  /* shadow */

  --shadow-sm: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);

    </style>
    <style id="critical-layout">
      *,*::before,*::after{box-sizing:border-box}
      html,body{height:100%}
      body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
      a{color:inherit;text-decoration:none}
      button{font-family:inherit;cursor:pointer}

      /* ===== App shell ===== */
      .app{display:flex;flex-direction:column;height:100vh;height:100svh;height:100dvh;background:var(--background)}

      /* ===== Top bar ===== */
      /* 顶栏不透明：去掉内容滚动区上方的 backdrop-filter，省每帧重采样开销 */
      .top-bar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--background)}
      ::selection{background:color-mix(in srgb,var(--chart-2) 32%,transparent)}
      :focus:not(:focus-visible){outline:none} /* 鼠标/触屏点击不显示焦点框 */
      button:focus{outline:none} /* Chrome 对按钮鼠标点击也判定 :focus-visible，需单独覆盖 */
      button:focus-visible{outline:2px solid color-mix(in srgb,var(--chart-2) 70%,transparent);outline-offset:2px}
      *{-webkit-tap-highlight-color:transparent} /* 移动端点击不闪现高亮块 */
      .top-title{display:flex;align-items:center;gap:10px;min-width:0}
      .top-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);flex:none}
      .top-title-text{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
      .top-title .c-sub{font-size:12px;color:var(--muted-foreground);font-weight:450;margin-left:2px;white-space:nowrap}
      .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--foreground);transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .16s ease;white-space:nowrap}
      .btn:hover{border-color:color-mix(in srgb,var(--muted-foreground) 38%,transparent);background:var(--accent)}
      .btn svg{width:13px;height:13px}
      .btn:active{transform:scale(.96)}

      /* ===== Content ===== */
      .content{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
      .summary{display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px}
      .summary-left{display:flex;flex-direction:column;gap:8px}
      .summary-title{font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--foreground);margin:0}
      .summary-sub{font-size:13px;color:var(--muted-foreground);line-height:1.6}
      .summary-right{display:flex;align-items:center;gap:14px}
      .pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;color:var(--success);border:1px solid color-mix(in srgb,var(--success) 35%,transparent);padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--success) 10%,transparent)}
      .pill .p-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
      .pill.err{color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 40%,transparent);background:color-mix(in srgb,var(--destructive) 8%,transparent)}
      .pill.err .p-dot{background:var(--destructive);box-shadow:0 0 8px var(--destructive)}

      .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      .dep{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
      .dep-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
      .dep-title{display:flex;align-items:center;gap:10px;min-width:0}
      .dep-dot{width:8px;height:8px;border-radius:50%;flex:none}
      .dep-dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}
      .dep-dot.blue{background:var(--chart-2);box-shadow:0 0 8px var(--chart-2)}
      .dep-dot.warn{background:var(--muted-foreground);box-shadow:none}
      .dep-name{font-size:15px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dep-status{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;flex:none}
      .dep-status.on{color:var(--success)}
      .dep-status.blue{color:var(--chart-2)}
      .dep-status.warn{color:var(--muted-foreground)}
      .dep-meta{display:flex;gap:18px;flex-wrap:wrap}
      .dep-field{display:flex;flex-direction:column;gap:3px}
      .dep-field .f-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}
      .dep-field .f-value{font-size:13px;color:var(--foreground);letter-spacing:.01em}
      .dep-field .f-value.dim{color:var(--muted-foreground)}

      .empty{text-align:center;padding:36px 16px;color:var(--muted-foreground);font-size:13px}
      .loading{text-align:center;padding:36px 16px;color:var(--muted-foreground);font-size:13px;font-family:var(--font-mono)}

      /* ===== Toast ===== */
      .toasts{position:fixed;top:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:10px;pointer-events:none}
      .toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--foreground);box-shadow:0 18px 50px -18px rgba(0,0,0,.55);min-width:220px;max-width:360px;display:flex;align-items:flex-start;gap:10px;opacity:0;transform:translateX(16px) translateY(-4px);transition:opacity .22s cubic-bezier(.2,.7,.2,1),transform .22s cubic-bezier(.2,.7,.2,1)}
      .toast.show{opacity:1;transform:none}
      .toast svg{width:16px;height:16px;flex:none;margin-top:1px}
      .toast.ok{border-color:color-mix(in srgb,var(--success) 40%,transparent)}
      .toast.ok svg{color:var(--success)}
      .toast.err{border-color:color-mix(in srgb,var(--destructive) 50%,transparent)}
      .toast.err svg{color:var(--destructive)}
      @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

      /* ===== Responsive ===== */
      @media (max-width:900px){
        body{overflow:auto}
        .app{height:auto;min-height:100vh;min-height:100svh}
        .top-bar{height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;gap:8px}
        .top-title .c-sub{display:none}
        .content{padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
        .summary{flex-direction:column;align-items:flex-start;gap:16px;padding:18px}
        .summary-title{font-size:20px}
        .grid{grid-template-columns:1fr}
        .toasts{left:14px;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
        .toast{width:100%;max-width:none;min-width:0}
        button{touch-action:manipulation}
      }
    </style>
</head>
<body>
    <div class="app">
      <div class="top-bar">
        <div class="top-title">
          <span class="top-dot" id="top-dot"></span>
          <span class="top-title-text">系统状态</span>
          <span class="c-sub">所有依赖与健康检查</span>
        </div>
        <div class="top-actions">
          <button class="btn" id="btn-refresh" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            重新探测
          </button>
          <button class="btn" id="btn-back" type="button">← 返回对话</button>
        </div>
      </div>

      <div class="content">
        <!-- 总览 -->
        <div class="summary">
          <div class="summary-left">
            <h2 class="summary-title" id="sum-title">系统运行正常</h2>
            <div class="summary-sub" id="sum-sub">探测中…</div>
          </div>
          <div class="summary-right">
            <span class="pill" id="sum-pill"><span class="p-dot"></span>ALL HEALTHY</span>
          </div>
        </div>

        <!-- 依赖项 -->
        <div class="grid" id="dep-grid">
          <div class="loading">加载中…</div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        var $ = function(s){ return document.querySelector(s); };
        var lastStatus = null;
        var lastHealth = null;

        var toastsBox = null;
        function toast(msg, ms, kind) {
          if (!toastsBox) {
            toastsBox = document.createElement('div');
            toastsBox.className = 'toasts';
            document.body.appendChild(toastsBox);
          }
          var el = document.createElement('div');
          el.className = 'toast ' + (kind === 'error' ? 'err' : (kind === 'ok' ? 'ok' : ''));
          var icon = kind === 'error'
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          el.innerHTML = icon + '<span></span>';
          el.querySelector('span').textContent = msg;
          toastsBox.appendChild(el);
          while (toastsBox.children.length > 4) { toastsBox.removeChild(toastsBox.firstChild); }
          requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });
          setTimeout(function(){
            el.classList.remove('show');
            setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
          }, ms || 2600);
        }

        async function api(path, opt) {
          var r = await fetch(path, opt);
          if (r.status === 401) { location.href = '/login'; throw new Error('未登录'); }
          if (!r.ok) {
            var m = '请求失败(' + r.status + ')';
            try { m = (await r.json()).detail || m; } catch (e) {}
            throw new Error(m);
          }
          return r.status === 200 ? r.json() : null;
        }

        function esc(s) { return String(s == null ? '' : s); }

        function renderDeps(status, health) {
          var grid = $('#dep-grid');
          grid.innerHTML = '';
          var deps = [];

          /* 1. LLM 服务 */
          var llmOnline = !!(status && status.active_online);
          var llmErr = status && status.active_error;
          var llmStatus = llmOnline ? 'ONLINE' : (llmErr ? 'OFFLINE' : 'UNKNOWN');
          var llmAddr = (status && status.local && status.local.base_url) || '127.0.0.1:11434';
          var llmModel = (status && status.local && status.local.model) || 'Qwen3.5-4B';
          deps.push({
            name: 'LLM 服务', cls: llmOnline ? 'on' : 'warn', statusCls: llmOnline ? 'on' : 'warn',
            status: llmStatus,
            fields: [
              ['地址', llmAddr],
              ['模型', llmModel],
              ['模式', (status && status.provider) === 'cloud' ? '云端 API' : '本地推理'],
            ]
          });

          /* 2. 语音合成 TTS */
          var voiceProvider = (status && status.voice_provider) || 'local';
          var voiceReg = !!(status && status.voice_registered);
          var ttsCls = voiceProvider === 'cloud' ? 'on' : 'blue';
          var ttsStatus = voiceProvider === 'cloud' ? 'CLOUD' : 'LOCAL';
          var voiceLabel = voiceProvider === 'minimax' ? 'MiniMax 海螺' : (voiceProvider === 'aliyun' ? '阿里云' : '本地克隆');
          deps.push({
            name: '语音合成 (TTS)', cls: ttsCls, statusCls: ttsCls,
            status: ttsStatus,
            fields: [
              ['引擎', voiceLabel],
              ['音色', voiceReg ? '已注册' : '待配置'],
              ['风格', (status && status.voice_style) || '默认'],
            ]
          });

          /* 3. TTS 缓存 */
          var cacheN = (health && health.tts_cache_files != null) ? health.tts_cache_files : '—';
          deps.push({
            name: 'TTS 缓存', cls: 'on', statusCls: 'on',
            status: 'READY',
            fields: [
              ['文件数', cacheN],
              ['策略', '自动清理'],
              ['路径', 'data/tts_cache/'],
            ]
          });

          deps.forEach(function(d){
            var card = document.createElement('div');
            card.className = 'dep';
            var meta = d.fields.map(function(f){
              return '<div class="dep-field"><span class="f-label">' + esc(f[0]) + '</span><span class="f-value">' + esc(f[1]) + '</span></div>';
            }).join('');
            card.innerHTML =
              '<div class="dep-head"><div class="dep-title"><span class="dep-dot ' + d.cls + '"></span><span class="dep-name"></span></div>' +
              '<span class="dep-status ' + d.statusCls + '"></span></div>' +
              '<div class="dep-meta">' + meta + '</div>';
            card.querySelector('.dep-name').textContent = d.name;
            card.querySelector('.dep-status').textContent = d.status;
            grid.appendChild(card);
          });
        }

        function renderSummary(status, health) {
          var allOk = !!(status && status.active_online);
          var title = $('#sum-title');
          var sub = $('#sum-sub');
          var pill = $('#sum-pill');
          var dot = $('#top-dot');

          if (allOk) {
            title.textContent = '系统运行正常';
            pill.className = 'pill';
            pill.innerHTML = '<span class="p-dot"></span>ALL HEALTHY';
            dot.style.background = 'var(--success)';
            dot.style.boxShadow = '0 0 8px var(--success)';
            var mode = status.provider === 'cloud' ? '云端对话' : '本地推理';
            var up = health && health.uptime != null ? Math.round(health.uptime) + 's' : '—';
            sub.textContent = '对话与语音服务就绪 · 模式 ' + mode + ' · 运行 ' + up;
          } else {
            title.textContent = '部分服务不可用';
            pill.className = 'pill err';
            pill.innerHTML = '<span class="p-dot"></span>DEGRADED';
            dot.style.background = 'var(--destructive)';
            dot.style.boxShadow = '0 0 8px var(--destructive)';
            sub.textContent = status && status.active_error ? String(status.active_error) : '服务探测异常，请检查后端与本地模型';
          }
        }

        /* 连续点击「重新探测」时慢响应可能晚于新请求返回并覆盖新结果：加序列号，过期响应丢弃 */
        var _loadSeq = 0;
        async function loadAll() {
          var seq = ++_loadSeq;
          try {
            /* 并行探测：原先串行等 /api/status 完了再等 /api/health，首屏慢一倍 */
            var res = await Promise.all([api('/api/status'), api('/api/health')]);
            if (seq !== _loadSeq) return;
            lastStatus = res[0];
            lastHealth = res[1];
            renderSummary(lastStatus, lastHealth);
            renderDeps(lastStatus, lastHealth);
          } catch (e) {
            if (seq !== _loadSeq) return;
            renderSummary(null, null);
            $('#dep-grid').innerHTML = '<div class="empty">无法连接后端服务<br><span style="font-size:12px;opacity:.8">请确认服务已启动（start.bat）</span></div>';
            $('#sum-sub').textContent = e.message || '连接失败';
          }
        }

        $('#btn-refresh').addEventListener('click', function(){
          loadAll();
          toast('正在重新探测…', 1500, '');
        });
        $('#btn-back').addEventListener('click', function(){ location.href = 'chat.html'; });

        loadAll();
      })();
    </script>
</body>
</html>
