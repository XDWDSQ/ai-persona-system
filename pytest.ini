[pytest]
# ---------------------------------------------------------------------------
# 离线测试收集边界（2026-09 第九轮新增）
#
# 为什么需要这个文件：项目根目录里除了 test_*.py 离线套件，还散落着
# 需要「真实运行中的服务」的运维/端到端脚本（ops/heic_upload_e2e_test.py
# 会在 import 期就 urllib 连 127.0.0.1:8000）。裸跑 `pytest` 时它会连同
# __pycache__、android、venv 一起被递归收集，直接 ConnectionRefused 收场，
# 表现为「测试套件坏了」，实际只是收集范围没划定。
#
# 约定：
#   - 根目录 test_*.py : 离线套件，pytest 可收集（run_tests.bat 也直跑同一批）
#   - ops/            : 需要真实服务/真实密钥的运维脚本，pytest 一律不收集
#   - venv/ android/  : 第三方与存档工程，永不收集
# ---------------------------------------------------------------------------
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ⚠ 覆盖 norecursedirs 会连带丢掉 pytest 的默认值，其中包含 `.*`（隐藏目录）。
# 本项目于是把 .pytest_cache 也纳入了递归收集 —— 而它在本机（移动云盘同步盘上）
# ACL 已损坏，scandir 直接 PermissionError: [WinError 5]，表现为
# `Interrupted: 1 error during collection`：裸 pytest 完全跑不起来，看起来像
# "测试套件坏了"，实际只是收集范围没排除缓存目录。所以 .pytest_cache / .ruff_cache
# 必须显式列出。
norecursedirs = ops venv .venv android __pycache__ .git data data-test static temp_seg node_modules .playwright-mcp download_site .pytest_cache .ruff_cache .pytest_tmp _qa_shots _tmp_ui_check

# 这两个套件在**模块级**就真连 api.xiaomimimo.com（test_mimo.py 顶部 httpx.get/post），
# pytest 为收集而 import 时就会发真实请求：无 key 直接报错，有 key 真烧额度。
# run_tests.bat 的黑名单管不到裸 pytest，必须在这里也忽略。
#
# --basetemp：pytest 默认把 tmp_path 的基目录放在 %TEMP%\pytest-of-<user>，而本机那个
# 目录 ACL 已损坏（PermissionError: [WinError 5]，连 takeown 都被拒），于是所有用到
# tmp_path 的用例在 setup 阶段集体报错 —— 表现为"142 passed / 30 errors"，而报错信息
# 与真实原因毫无关系。显式指到项目内的可写目录，任何机器上都不会因此翻车。
addopts = --ignore=test_mimo.py --ignore=test_tts.py --basetemp=.pytest_tmp/base

# 缓存目录同理不放 .pytest_cache：该目录在本机 ACL 已损坏且删不掉（拒绝访问），
# pytest 每次都会因为写不进去而刷一堆 PytestCacheWarning。
cache_dir = .pytest_tmp/cache
