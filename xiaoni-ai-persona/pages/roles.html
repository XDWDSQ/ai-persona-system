<html lang="zh-CN" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>角色管理 · 小拟</title>

    <style id="theme-vars">
/* Source: Vercel Design Library (dl_builtin_vercel) — verbatim tokens.
   Project-local bridge: adds --vercel-radius-sm/md/lg semantic aliases
   derived from the Library's own --radius token, required by
   apply-html-head-contract.mjs. Library directory is read-only. */

:root {
  --vercel-background: var(--background, #ffffff);
  --vercel-foreground: var(--foreground, #0f172a);
  --vercel-card: var(--card, var(--background));
  --vercel-card-foreground: var(--card-foreground, var(--foreground));
  --vercel-popover: var(--popover, var(--card));
  --vercel-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --vercel-primary: var(--primary, #111827);
  --vercel-primary-foreground: var(--primary-foreground, #ffffff);
  --vercel-secondary: var(--secondary, var(--muted, var(--card)));
  --vercel-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --vercel-muted: var(--muted, var(--card));
  --vercel-muted-foreground: var(--muted-foreground, var(--foreground));
  --vercel-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --vercel-accent-foreground: var(--accent-foreground, var(--foreground));
  --vercel-destructive: var(--destructive, #ef4444);
  --vercel-destructive-foreground: var(--destructive-foreground, #ffffff);
  --vercel-border: var(--border, currentColor);
  --vercel-input: var(--input, var(--border));
  --vercel-ring: var(--ring, var(--primary));
  --vercel-chart-1: var(--chart-1, var(--primary));
  --vercel-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --vercel-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --vercel-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --vercel-chart-5: var(--chart-5, var(--foreground));
  --vercel-sidebar: var(--sidebar, var(--background));
  --vercel-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --vercel-sidebar-primary: var(--sidebar-primary, var(--primary));
  --vercel-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --vercel-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --vercel-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

  --vercel-radius-sm: calc(var(--radius) - 2px);
  --vercel-radius-md: var(--radius);
  --vercel-radius-lg: calc(var(--radius) + 4px);
  --vercel-radius-small: calc(var(--radius) - 2px);
  --vercel-radius-medium: var(--radius);
  --vercel-radius-large: calc(var(--radius) + 4px);

/* bg */
  --background: #ffffff;
  --card: #ffffff;
  --popover: #ffffff;
  --muted: #f5f5f5;

  /* text */
  --foreground: #0a0a0a;
  --card-foreground: #0a0a0a;
  --popover-foreground: #0a0a0a;
  --primary-foreground: #fafafa;
  --secondary-foreground: #171717;
  --muted-foreground: #858585;
  --accent-foreground: #171717;
  --destructive-foreground: #ffffff;

  /* accent */
  --primary: #121212;
  --secondary: #f5f5f5;
  --accent: #f5f5f5;
  --input: #e5e5e5;
  --ring: #0d0d0d;

  /* border */
  --border: #e8e8e8;

  /* success */
  --success-subtle: #14241a;
  --success: #62d178;
  --success-strong: #8be59c;
  --success-foreground: #0a0a0a;

  /* error */
  --error-subtle: #2a1517;
  --error: #ff6166;
  --error-strong: #ff9a9d;
  --error-foreground: #0a0a0a;

  /* status */
  --destructive: #e7000b;

  /* chart */
  --chart-1: #91c5ff;
  --chart-2: #3a81f6;
  --chart-3: #2563ef;
  --chart-4: #1a4eda;
  --chart-5: #1f3fad;

  /* sidebar */
  --sidebar: #fafafa;
  --sidebar-foreground: #0a0a0a;
  --sidebar-primary: #171717;
  --sidebar-primary-foreground: #fafafa;
  --sidebar-accent: #f5f5f5;
  --sidebar-accent-foreground: #171717;
  --sidebar-border: #e5e5e5;
  --sidebar-ring: #a1a1a1;

  /* font */
  --font-sans: Geist, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Serif Display, ui-serif, serif;
  --font-mono: Geist Mono, ui-monospace, monospace;

  /* radius */
  --radius: 0.5rem;

  /* shadow */
  --shadow-x: 0;
  --shadow-y: 1px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;
  --shadow-2xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 1px 0px 0px rgba(0,0,0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 1px 0px 0px rgba(0, 0, 0, 0);

  /* typography */
  --tracking-normal: 0em;

  /* spacing */
  --spacing: 0.25rem;
}

.dark {
  /* bg */
  --background: #0a0a0a;
  --card: #171717;
  --popover: #262626;
  --muted: #262626;

  /* text */
  --foreground: #fafafa;
  --card-foreground: #fafafa;
  --popover-foreground: #fafafa;
  --primary-foreground: #171717;
  --secondary-foreground: #fafafa;
  --muted-foreground: #a1a1a1;
  --accent-foreground: #fafafa;
  --destructive-foreground: #fafafa;

  /* accent */
  --primary: #e5e5e5;
  --secondary: #262626;
  --accent: #404040;
  --input: #343434;
  --ring: #737373;

  /* border */
  --border: #282828;

  /* success */
  --success-subtle: #14241a;
  --success: #62d178;
  --success-strong: #8be59c;
  --success-foreground: #0a0a0a;

  /* error */
  --error-subtle: #2a1517;
  --error: #ff6166;
  --error-strong: #ff9a9d;
  --error-foreground: #0a0a0a;

  /* status */
  --destructive: #ff6467;

  /* chart */
  --chart-1: #91c5ff;
  --chart-2: #3a81f6;
  --chart-3: #2563ef;
  --chart-4: #1a4eda;
  --chart-5: #1f3fad;

  /* sidebar */
  --sidebar: #171717;
  --sidebar-foreground: #fafafa;
  --sidebar-primary: #1447e6;
  --sidebar-primary-foreground: #fafafa;
  --sidebar-accent: #262626;
  --sidebar-accent-foreground: #fafafa;
  --sidebar-border: #282828;
  --sidebar-ring: #525252;

  /* font */
  --font-sans: Geist, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Serif Display, ui-serif, serif;
  --font-mono: Geist Mono, ui-monospace, monospace;

  /* radius */
  --radius: 0.5rem;

  /* shadow */
  --shadow-x: 0;
  --shadow-y: 1px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;
  --shadow-2xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 1px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 1px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 1px 0px 0px rgba(0,0,0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 1px 0px 0px rgba(0, 0, 0, 0);
}
    </style>
    <style id="critical-layout">
      *,*::before,*::after{box-sizing:border-box}
      html,body{height:100%}
      body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
      a{color:inherit;text-decoration:none}
      button{font-family:inherit;cursor:pointer}
      [data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}

      /* ===== App shell ===== */
      .app{display:flex;height:100vh;height:100svh;height:100dvh;background:var(--background)}

      /* ===== Sidebar ===== */
      .side{width:240px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--card)}
      .side-head{padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px}
      .side-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground)}
      .side-eyebrow .pip{width:6px;height:6px;border-radius:50%;background:var(--chart-2);box-shadow:0 0 10px color-mix(in srgb,var(--chart-2) 70%,transparent);flex:none}
      .side-title{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0}
      .role-list{padding:8px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
      .role-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted-foreground);font-size:13px;text-align:left;cursor:pointer;transition:background-color .14s ease,color .14s ease,border-color .14s ease}
      .role-item:hover{background:var(--accent);color:var(--foreground)}
      .role-item.active{background:var(--secondary);color:var(--foreground);border-color:color-mix(in srgb,var(--muted-foreground) 26%,transparent)}
      .role-item .r-ava{width:36px;height:36px;border-radius:9px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--chart-2);flex:none}
      .role-item.active .r-ava{background:var(--chart-2);color:#fff}
      .role-item .r-ava img{width:100%;height:100%;border-radius:9px;object-fit:cover;display:block}
      .role-item .r-body{flex:1;min-width:0}
      .role-item .r-name{display:block;font-size:14px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .role-item:not(.active) .r-name{color:var(--muted-foreground)}
      .role-item .r-meta{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);opacity:.75;margin-top:3px}
      .role-add{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--muted-foreground) 40%,transparent);background:transparent;color:var(--muted-foreground);font-size:13px;text-align:left;cursor:pointer;transition:color .14s ease,border-color .14s ease}
      .role-add:hover{color:var(--foreground);border-color:color-mix(in srgb,var(--chart-2) 45%,transparent)}
      .role-add svg{width:16px;height:16px;flex:none}

      /* ===== Main ===== */
      .main{flex:1;display:flex;flex-direction:column;min-width:0}
      /* 顶栏不透明：原半透明+backdrop-filter 在内容滚动时每帧重采样，去掉更流畅 */
      .top-bar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--background)}
      ::selection{background:color-mix(in srgb,var(--chart-2) 32%,transparent)}
      button:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--chart-2) 70%,transparent);outline-offset:2px}
      .top-title{display:flex;align-items:center;gap:10px;min-width:0}
      .top-title .t-ava{width:28px;height:28px;border-radius:7px;background:var(--chart-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
      .top-title .t-ava img{width:100%;height:100%;border-radius:7px;object-fit:cover;display:block}
      .top-title-text{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
      .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .16s ease;white-space:nowrap}
      .btn-primary{background:var(--chart-2);color:#fff}
      .btn-primary:hover{transform:translateY(-1px)}
      .btn-ghost{background:var(--background);color:var(--muted-foreground);border-color:var(--border)}
      .btn-ghost:hover{color:var(--foreground);border-color:color-mix(in srgb,var(--muted-foreground) 38%,transparent)}
      .btn-danger{background:var(--background);color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 40%,transparent)}
      .btn-danger:hover{border-color:var(--destructive)}

      .content{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
      .stat-row{display:flex;gap:14px}
      .stat-card{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
      .stat-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
      .stat-value{font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .stat-value.ok{color:var(--success)}
      .stat-hint{font-size:10.5px;color:var(--muted-foreground);opacity:.75}
      .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
      .block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
      .block-title{display:flex;align-items:center;gap:8px}
      .block-title h3{font-size:13px;font-weight:600;margin:0;color:var(--foreground)}
      .block-title .b-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);opacity:.75}
      .block-head .mini-btn{height:28px;padding:0 12px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);cursor:pointer;transition:color .16s ease,border-color .16s ease}
      .block-head .mini-btn:hover{color:var(--foreground);border-color:color-mix(in srgb,var(--muted-foreground) 38%,transparent)}
      .persona-card{background:var(--background);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
      .persona-card textarea{width:100%;background:transparent;border:none;outline:none;color:var(--foreground);font-size:13px;line-height:1.7;resize:vertical;min-height:72px;font-family:inherit}
      .persona-card textarea::placeholder{color:var(--muted-foreground)}
      .mem-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--background);margin-bottom:8px}
      .mem-item:last-child{margin-bottom:0}
      .mem-dot{width:6px;height:6px;border-radius:50%;background:var(--chart-2);flex:none;margin-top:6px}
      .mem-dot.mid{background:var(--success)}
      .mem-dot.low{background:var(--muted-foreground)}
      .mem-body{flex:1;min-width:0}
      .mem-text{font-size:13px;line-height:1.55;color:var(--foreground)}
      .mem-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);opacity:.75;margin-top:4px}
      .empty{text-align:center;padding:36px 16px;color:var(--muted-foreground);font-size:13px}
      .loading{text-align:center;padding:36px 16px;color:var(--muted-foreground);font-size:13px;font-family:var(--font-mono)}

      /* ===== Toast ===== */
      .toasts{position:fixed;top:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:10px;pointer-events:none}
      .toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--foreground);box-shadow:0 18px 50px -18px rgba(0,0,0,.55);min-width:220px;max-width:360px;display:flex;align-items:flex-start;gap:10px;opacity:0;transform:translateX(16px) translateY(-4px);transition:opacity .22s cubic-bezier(.2,.7,.2,1),transform .22s cubic-bezier(.2,.7,.2,1)}
      .toast.show{opacity:1;transform:none}
      .toast svg{width:16px;height:16px;flex:none;margin-top:1px}
      .toast.ok{border-color:color-mix(in srgb,var(--success) 40%,transparent)}
      .toast.ok svg{color:var(--success)}
      .toast.err{border-color:color-mix(in srgb,var(--destructive) 50%,transparent)}
      .toast.err svg{color:var(--destructive)}
      @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

      /* ===== Responsive ===== */
      @media (max-width:900px){
        body{overflow:auto}
        .app{height:auto;min-height:100vh;min-height:100svh;flex-direction:column}
        .side{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--border)}
        .side-head{padding-top:calc(18px + env(safe-area-inset-top,0px))}
        .role-list{flex:none;max-height:none;overflow:visible}
        .content{padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
        .stat-row{flex-wrap:wrap}
        .stat-card{min-width:calc(50% - 7px)}
        .top-bar{height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;gap:8px;flex-wrap:wrap;height:auto;min-height:calc(56px + env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
        .toasts{left:14px;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
        .toast{width:100%;max-width:none;min-width:0}
        .top-title-text{white-space:normal}
        button,.role-item,.role-add{touch-action:manipulation}
      }
    </style>
</head>
<body>
    <div class="app">
      <!-- ===== SIDEBAR ===== -->
      <aside class="side" aria-label="角色列表">
        <div class="side-head">
          <span class="side-eyebrow"><span class="pip"></span>角色管理</span>
          <h2 class="side-title">角色与引擎</h2>
        </div>
        <div class="role-list" id="role-list">
          <!-- 由 JS 渲染 -->
        </div>
      </aside>

      <!-- ===== MAIN ===== -->
      <div class="main">
        <div class="top-bar">
          <div class="top-title">
            <span class="t-ava" id="top-ava">拟</span>
            <span class="top-title-text" id="top-title">小拟 · 角色详情</span>
          </div>
          <div class="top-actions">
            <button class="btn btn-primary" id="btn-apply" title="将当前角色设为对话角色" type="button">应用此角色</button>
            <button class="btn btn-ghost" id="btn-back" title="返回对话" type="button">← 返回对话</button>
          </div>
        </div>

        <div class="content">
          <!-- 指标卡 -->
          <div class="stat-row">
            <div class="stat-card">
              <span class="stat-label">记忆数</span>
              <span class="stat-value" id="stat-memory">—</span>
              <span class="stat-hint">角色引擎长期记忆</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">情绪状态</span>
              <span class="stat-value" id="stat-emotion">—</span>
              <span class="stat-hint" id="stat-emotion-hint">上次更新 —</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">主动问候</span>
              <span class="stat-value ok" id="stat-greeting">已开启</span>
              <span class="stat-hint">可在聊天页设置中关闭</span>
            </div>
          </div>

          <!-- 人设描述 -->
          <div class="block">
            <div class="block-head">
              <div class="block-title">
                <h3>人设描述</h3>
                <span class="b-hint" id="persona-hint">编辑后点保存生效</span>
              </div>
              <button class="mini-btn" id="btn-save-persona" type="button">保存人设</button>
            </div>
            <div class="persona-card">
              <textarea id="persona" placeholder="定义角色性格、语气、说话方式…" spellcheck="false"></textarea>
            </div>
          </div>

          <!-- 最近记忆 -->
          <div class="block">
            <div class="block-head">
              <div class="block-title">
                <h3>最近记忆</h3>
                <span class="b-hint" id="mem-count-hint">—</span>
              </div>
              <button class="mini-btn" id="btn-reset" type="button">清空记忆</button>
            </div>
            <div id="mem-list">
              <div class="loading">加载中…</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        var $ = function(s){ return document.querySelector(s); };
        var state = { roles: [], activeRole: '', activeRoleData: null };
        /* 角色数据加载竞态保护：快速切换角色时，慢响应可能晚于新角色返回，
           把旧角色的记忆/人设渲染到当前视图 → 每次 selectRole 递增序列号，过期响应丢弃 */
        var _roleSeq = 0;

        /* ---------- toast ---------- */
        var toastsBox = null;
        function toast(msg, ms, kind) {
          if (!toastsBox) {
            toastsBox = document.createElement('div');
            toastsBox.className = 'toasts';
            document.body.appendChild(toastsBox);
          }
          var el = document.createElement('div');
          el.className = 'toast ' + (kind === 'error' ? 'err' : (kind === 'ok' ? 'ok' : ''));
          var icon = kind === 'error'
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
          el.innerHTML = icon + '<span></span>';
          el.querySelector('span').textContent = msg;
          toastsBox.appendChild(el);
          while (toastsBox.children.length > 4) { toastsBox.removeChild(toastsBox.firstChild); }
          requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });
          setTimeout(function(){
            el.classList.remove('show');
            setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
          }, ms || 2600);
        }

        async function api(path, opt) {
          var r = await fetch(path, opt);
          if (r.status === 401) { location.href = '/login'; throw new Error('未登录'); }
          if (!r.ok) {
            var m = '请求失败(' + r.status + ')';
            try { m = (await r.json()).detail || m; } catch (e) {}
            throw new Error(m);
          }
          return r.status === 200 ? r.json() : null;
        }

        function roleInitial(key, name) {
          var first = (name || key || '?').trim().charAt(0);
          return first || '?';
        }

        function renderSidebar() {
          var list = $('#role-list');
          list.innerHTML = '';
          state.roles.forEach(function(r){
            var it = document.createElement('button');
            it.className = 'role-item' + (r.key === state.activeRole ? ' active' : '');
            it.type = 'button';
            var full = r.full_name || r.name || r.key;
            it.innerHTML = '<span class="r-ava"></span><span class="r-body"><span class="r-name"></span><span class="r-meta"></span></span>';
            it.querySelector('.r-name').textContent = full;
            var metaText = r.desc ? r.desc : (r.voice_registered ? '音色已注册' : '语音参数默认');
            it.querySelector('.r-meta').textContent = metaText;
            it.querySelector('.r-ava').textContent = roleInitial(r.key, full);
            it.addEventListener('click', function(){ selectRole(r.key); });
            list.appendChild(it);
          });
          var add = document.createElement('button');
          add.className = 'role-add';
          add.type = 'button';
          add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>新建角色</span>';
          add.addEventListener('click', function(){
            /* 后端无创建角色接口：明确指引，不再假装能创建 */
            toast('暂不支持在页面新建角色——请在 config.json 的 roles 中配置（含人设与音色参数），重启服务后生效', 4000);
          });
          list.appendChild(add);
        }

        function renderDetail() {
          var r = state.activeRoleData;
          if (!r) return;
          var full = r.full_name || r.name || state.activeRole;
          $('#top-ava').textContent = roleInitial(state.activeRole, full);
          $('#top-title').textContent = full + ' · 角色详情';
        }

        function emotionLabel(em) {
          if (!em) return '平静';
          if (typeof em === 'string') return em;
          var v = em.valence != null ? em.valence : 0;
          var a = em.arousal != null ? em.arousal : 0;
          if (v >= 0.3 && a >= 0.3) return '兴奋';
          if (v >= 0.3) return '愉悦';
          if (v <= -0.3 && a >= 0.3) return '激动';
          if (v <= -0.3) return '低落';
          if (a >= 0.3) return '专注';
          if (a <= -0.3) return '放松';
          return '平静';
        }

        function renderState(st) {
          if (!st || !st.enabled) {
            $('#stat-memory').textContent = '—';
            $('#stat-emotion').textContent = '未开启';
            $('#stat-emotion-hint').textContent = '角色引擎未启用';
            $('#mem-count-hint').textContent = '引擎未启用';
            $('#mem-list').innerHTML = '<div class="empty">角色引擎未启用，无记忆数据</div>';
            return;
          }
          $('#stat-memory').textContent = (st.memory_count != null ? st.memory_count : 0);
          $('#stat-emotion').textContent = emotionLabel(st.emotion);
          /* last_update 可能是任意类型（手改/损坏的 JSON）——String() 防御，避免 TypeError 中断渲染 */
          var lu = String(st.last_update || '').replace('T', ' ').slice(0, 16);
          $('#stat-emotion-hint').textContent = '上次更新 ' + (lu || '—');
          $('#mem-count-hint').textContent = '记忆库 ' + (st.memory_count || 0) + ' 条';
          if (!st.memory_count) {
            $('#mem-list').innerHTML = '<div class="empty">还没有记忆，多聊几句就有了</div>';
          }
        }

        function renderMemories(items) {
          var box = $('#mem-list');
          if (!items || !items.length) {
            box.innerHTML = '<div class="empty">还没有记忆，多聊几句就有了</div>';
            return;
          }
          box.innerHTML = '';
          items.forEach(function(m, i){
            var cls = i === 0 ? '' : (i === 1 ? ' mid' : ' low');
            var it = document.createElement('div');
            it.className = 'mem-item';
            it.innerHTML = '<span class="mem-dot' + cls + '"></span><div class="mem-body"><div class="mem-text"></div><div class="mem-meta"></div></div>';
            it.querySelector('.mem-text').textContent = m.summary || m.text || (m.content || '');
            var meta = [];
            if (m.time) meta.push(m.time);
            if (m.weight != null) meta.push('权重 ' + Number(m.weight).toFixed(2));
            if (m.hits != null && m.hits > 1) meta.push('命中 ' + m.hits + ' 次');
            it.querySelector('.mem-meta').textContent = meta.join(' · ');
            box.appendChild(it);
          });
        }

        function selectRole(key) {
          if (key === state.activeRole) return;
          state.activeRole = key;
          _roleSeq++;   /* 作废在途的旧角色请求 */
          var r = state.roles.find(function(x){ return x.key === key; });
          state.activeRoleData = r || null;
          renderSidebar();
          renderDetail();
          loadState();
          loadMemories();
          loadPersona();
        }

        async function loadRoles() {
          try {
            var data = await api('/api/status');
            state.roles = data.roles || [];
            state.activeRole = data.active_role || '';
            state.activeRoleData = state.roles.find(function(x){ return x.key === state.activeRole; }) || null;
            /* 主动问候状态与聊天页设置面板同步（chat.html 的 greeting_toggle 存 localStorage） */
            var gOn = true;
            try { gOn = localStorage.getItem('xiaoni_greeting_enabled') !== '0'; } catch (e) {}
            var gEl = $('#stat-greeting');
            if (gEl) {
              gEl.textContent = gOn ? '已开启' : '已关闭';
              gEl.classList.toggle('ok', gOn);
            }
            renderSidebar();
            renderDetail();
            loadState();
            loadMemories();
            loadPersona();
          } catch (e) {
            toast(e.message || '加载角色失败', 3000, 'error');
            $('#role-list').innerHTML = '<div class="empty">角色加载失败<br>请确认后端服务已启动</div>';
          }
        }

        async function loadState() {
          var seq = _roleSeq;
          try {
            var st = await api('/api/state');
            if (seq !== _roleSeq) return;  /* 已切到其他角色，丢弃过期响应 */
            renderState(st);
          } catch (e) {
            if (seq !== _roleSeq) return;
            $('#stat-memory').textContent = '—';
            $('#stat-emotion').textContent = '—';
          }
        }

        function fmtTime(iso) {
          if (!iso) return '';
          var d = new Date(iso);
          if (isNaN(d.getTime())) return iso;
          var now = new Date();
          var diff = (now - d) / 1000;
          if (diff < 60) return '刚刚';
          if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
          if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
          if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
          var mm = String(d.getMonth() + 1).padStart(2, '0');
          var dd = String(d.getDate()).padStart(2, '0');
          return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '-') + mm + '-' + dd;
        }

        async function loadMemories() {
          var seq = _roleSeq;
          $('#mem-list').innerHTML = '<div class="loading">记忆数据加载中…</div>';
          var items = [];
          try {
            var data = await api('/api/roles/memories?role=' + encodeURIComponent(state.activeRole) + '&top=10');
            if (seq !== _roleSeq) return;  /* 已切到其他角色，丢弃过期响应 */
            if (data && data.enabled && data.memories) {
              items = data.memories.map(function(m){
                return {
                  text: m.text,
                  weight: m.importance,
                  time: fmtTime(m.last_hit || m.created_at),
                  hits: m.hit_count,
                };
              });
            }
          } catch (e) { /* 接口失败静默，下方兜底 */ }
          if (!items.length) {
            /* 兜底：角色现实动态 */
            try {
              var news = await api('/api/role-news');
              if (seq !== _roleSeq) return;
              if (news && news.enabled && news.news) {
                items.push({ summary: '现实动态：' + news.news, time: '最近更新' });
              }
            } catch (e) {}
          }
          renderMemories(items);
        }

        async function loadPersona() {
          var seq = _roleSeq;
          try {
            var data = await api('/api/status');
            if (seq !== _roleSeq) return;
            var p = data.persona;
            $('#persona').value = p || '';
            personaSavedValue = p || '';
            markPersonaDirty();
          } catch (e) {}
        }

        /* ---------- actions ---------- */
        $('#btn-apply').addEventListener('click', async function(){
          try {
            await api('/api/roles/apply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ key: state.activeRole }),
            });
            /* toast 用角色显示名，不再暴露内部 key */
            var r = state.activeRoleData || {};
            toast('已切换角色：' + (r.name || r.full_name || state.activeRole), 2000, 'ok');
          } catch (e) {
            toast(e.message || '切换失败', 3000, 'error');
          }
        });

        /* 人设保存：/api/config 支持局部更新 persona 字段（空串字段会被后端跳过，安全） */
        var personaSavedValue = '';
        function markPersonaDirty() {
          var hint = $('#persona-hint');
          var dirty = $('#persona').value !== personaSavedValue;
          if (hint) hint.textContent = dirty ? '有未保存的修改' : '编辑后点保存生效';
        }
        $('#persona').addEventListener('input', markPersonaDirty);
        $('#btn-save-persona').addEventListener('click', async function(){
          var v = $('#persona').value;
          if (!v.trim()) { toast('人设不能为空', 2400, 'error'); return; }
          var btn = this;
          btn.disabled = true;
          try {
            await api('/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ persona: v }),
            });
            personaSavedValue = v;
            markPersonaDirty();
            toast('人设已保存，新对话立即生效', 2400, 'ok');
          } catch (e) {
            toast(e.message || '保存失败', 3000, 'error');
          } finally {
            btn.disabled = false;
          }
        });

        $('#btn-reset').addEventListener('click', async function(){
          if (!window.confirm('确定清空当前角色的全部记忆与状态吗？此操作不可恢复。')) return;
          try {
            await api('/api/state', { method: 'DELETE' });
            toast('已清空记忆与状态', 2200, 'ok');
            loadState();
            loadMemories();
          } catch (e) {
            toast(e.message || '清空失败', 3000, 'error');
          }
        });

        $('#btn-back').addEventListener('click', function(){ location.href = 'chat.html'; });

        loadRoles();
      })();
    </script>
</body>
</html>
