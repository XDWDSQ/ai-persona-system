<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2027 KPL 赛季 · 赛程表</title>
<style>
  :root{
    --bg:#ffffff; --fg:#0a0a0a; --muted:#6b7280; --border:#e8e8e8;
    --card:#ffffff; --card2:#f8f8f8; --accent:#e2263d; --accent-soft:#fdeef0;
    --gold:#f5b942; --gold-soft:#fdf6e3; --ok:#16a34a; --bad:#dc2626;
    --train:#e5e7eb; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0a0a; --fg:#fafafa; --muted:#9ca3af; --border:#282828;
      --card:#121212; --card2:#1a1a1a; --accent:#ff4d5e; --accent-soft:#2a1518;
      --gold:#f5b942; --gold-soft:#2a2415; --train:#262626;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* 顶部 */
  .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .top-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-weight:600;transition:background .2s}
  .back:hover{background:var(--card2)}
  .back svg{width:15px;height:15px}
  .top h1{font-size:16px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mode-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
  .mode-badge.override{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .today-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;transition:opacity .2s}
  .today-btn:disabled{opacity:.45;cursor:not-allowed}
  .today-btn svg{width:14px;height:14px}

  .wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}

  /* 今日剧情卡 */
  .today-card{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 72%,#000) 100%);color:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .today-card .t1{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.5px}
  .today-card .t2{font-size:17px;font-weight:800;margin-top:5px;line-height:1.45}
  .today-card .t3{font-size:12.5px;margin-top:8px;opacity:.95;line-height:1.5}
  .today-card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
  .chip.gold{background:var(--gold);color:#3a2a00}

  /* 赛段进度条 */
  .stages{display:flex;gap:3px;margin-bottom:14px;border-radius:12px;overflow:hidden;border:1px solid var(--border);height:26px}
  .stages div{flex:1;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .st-regular{background:#4b6cb7}
  .st-playoff{background:#8e44ad}
  .st-final{background:var(--gold);color:#3a2a00}
  .st-off{background:var(--train);color:var(--muted)}
  .st-arena{background:#16a34a}

  /* 面板 */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .panel-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .panel-h b{font-size:14px}
  .panel-h .hint{font-size:11px;color:var(--muted)}
  .cal-nav{display:flex;align-items:center;gap:8px}
  .cal-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:background .2s}
  .cal-nav button:hover{background:var(--card2)}
  .cal-nav .ym{font-size:14px;font-weight:800;min-width:96px;text-align:center}

  /* 日历 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
  .cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
  .day{position:relative;min-height:52px;border-radius:10px;border:1px solid var(--border);background:var(--card2);padding:5px;display:flex;flex-direction:column;gap:2px;transition:transform .15s ease,box-shadow .15s ease;text-align:left;overflow:hidden}
  .day:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .day .dn{font-size:11px;font-weight:700;opacity:.75}
  .day .tag{font-size:9px;font-weight:700;line-height:1.25;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .day.empty{visibility:hidden}
  .day.off{background:repeating-linear-gradient(45deg,var(--card2) 0 6px,color-mix(in srgb,var(--card2) 70%,var(--border)) 6px 12px);border-style:dashed;opacity:.75}
  .day.match{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .day.match .tag{color:var(--accent)}
  .day.match.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card2))}
  .day.match.win .tag{color:var(--ok)}
  .day.match.loss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card2))}
  .day.match.loss .tag{color:var(--bad)}
  .day.match.skipped{opacity:.4}
  .day.event{border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:var(--gold-soft)}
  .day.event .tag{color:var(--gold)}
  .day.today{outline:2.5px solid var(--accent);outline-offset:1px}
  .day.past{opacity:.55}
  .day .res{font-size:10px;font-weight:800}
  .day .res.w{color:var(--ok)} .day .res.l{color:var(--bad)}

  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .v{font-size:20px;font-weight:800}
  .stat .k{font-size:11px;color:var(--muted);margin-top:2px}
  .stat.win .v{color:var(--ok)} .stat.loss .v{color:var(--bad)}
  .stat.stage .v{color:var(--accent);font-size:15px;line-height:1.3;padding-top:3px}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }

  .foot{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 30px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  .toast.show{opacity:1}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:14px}

  /* 今日剧情指引（折叠）：今日卡底部展开，文案来自后端 guide */
  .today-card details{margin-top:10px}
  .today-card summary{display:inline-block;font-size:12px;font-weight:700;cursor:pointer;opacity:.9;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);user-select:none}
  .today-card summary:hover{background:rgba(255,255,255,.24)}
  .today-card .guide-body{margin-top:9px;font-size:12.5px;line-height:1.75;opacity:.96}

  /* 剧情时间线：倒序展示赛果/首败大吵/阶段推进/撤销等系统日志 */
  .loglist{padding:6px 0}
  .log-item{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.6}
  .log-item:last-child{border-bottom:none}
  .log-item .ld{flex:none;color:var(--muted);font-weight:600;font-size:11.5px;padding-top:1px}
  .log-item .lt{color:var(--fg)}
  .log-item.stage .lt{color:var(--accent);font-weight:700}
  .log-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px}

  /* 赛果详情弹层：点已赛/取消场次弹详情与撤销；点其他日期仍是跳转确认 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-mask.show{display:flex}
  .modal{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:mpop .18s ease}
  @keyframes mpop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-h b{font-size:14px}
  .modal-h .x{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  .modal-h .x:hover{background:var(--card2)}
  .modal-b{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.7}
  .modal-b .row2{display:flex;justify-content:space-between;gap:12px}
  .modal-b .row2 span:first-child{color:var(--muted);flex:none}
  .modal-b .row2 span:last-child{font-weight:600;text-align:right}
  .modal-f{padding:12px 16px 16px;display:flex;gap:10px}
  .modal-f button{flex:1;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border);transition:background .2s}
  .modal-f .jump{background:var(--card2)}
  .modal-f .jump:hover{background:var(--border)}
  .modal-f .undo{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .modal-f .undo:hover{background:color-mix(in srgb,var(--accent) 18%,var(--card))}
  .modal-f .undo:disabled{opacity:.5;cursor:not-allowed}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <a class="back" href="/pages/chat.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      聊天
    </a>
    <h1>2027 KPL 赛季 · 赛程表</h1>
    <span class="mode-badge" id="modeBadge">跟随现实</span>
    <button class="today-btn" id="todayBtn" title="回到现实今天">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      回到今天
    </button>
  </div>
</div>

<div class="wrap">
  <div class="today-card" id="todayCard">
    <div class="t1" id="tStage">加载中…</div>
    <div class="t2" id="tTitle"></div>
    <div class="t3" id="tDesc"></div>
    <div class="row" id="tChips"></div>
  </div>

  <div class="stages" id="stagesBar"></div>

  <div class="panel">
    <div class="panel-h">
      <b>赛程日历</b>
      <span class="hint">点击任意日期跳转 · 红=比赛日 金=事件 灰=训练 虚线=休赛</span>
      <div class="cal-nav">
        <button id="prevM" aria-label="上一月">‹</button>
        <span class="ym" id="ymLabel"></span>
        <button id="nextM" aria-label="下一月">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="panel">
    <div class="panel-h">
      <b>剧情时间线</b>
      <span class="hint">赛果 / 首败大吵 / 阶段推进 / 撤销，倒序最近 30 条</span>
    </div>
    <div class="loglist" id="logList"></div>
  </div>
</div>

<!-- 赛果详情弹层 -->
<div class="modal-mask" id="modalMask" role="dialog" aria-modal="true" aria-label="比赛详情">
  <div class="modal">
    <div class="modal-h"><b id="mTitle">比赛详情</b><button class="x" id="mClose" aria-label="关闭">✕</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f">
      <button class="jump" id="mJump">回到这天</button>
      <button class="undo" id="mUndo">撤销这个结果</button>
    </div>
  </div>
</div>

<div class="foot">赛程结构参照 KPL 真实赛制（2025/2026 外推）· 比赛结果由岚风在对话中宣布 · 数据存于云端</div>
<div class="toast" id="toast"></div>

<script>
var API = {
  /* 统一错误处理：401 跳登录；其余非 2xx 解析后端 {detail} 提示文案（撤销/跳转失败时用户能看到具体原因） */
  _check: function(r){
    if (r.status === 401) { location.href = '/login'; throw new Error('未登录'); }
    if (!r.ok) {
      return r.json().then(function(d){ throw new Error((d && d.detail) || ('请求失败（' + r.status + '）')); },
        function(){ throw new Error('请求失败（' + r.status + '）'); });
    }
    return r.json();
  },
  get: function(path){ return fetch(path).then(API._check); },
  post: function(path, body){ return fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})}).then(API._check); }
};
var D = {};           /* calendar 数据 */
var S = null;         /* status 数据 */
var viewMonth = null; /* 当前显示的月份 {y,m} */

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

/* 加载状态 */
function renderToday(){
  if (!S) return;
  document.getElementById('tStage').textContent = S.virtual_date + '（星期' + S.weekday + '）· ' + S.stage_name;
  document.getElementById('tTitle').textContent = S.today.title;
  var desc = '';
  if (S.today.event && S.today.event.desc) desc = S.today.event.desc;
  else if (S.today.match && S.today.match.result) {
    var r = S.today.match.result;
    desc = (r.win ? 'AG 拿下这场比赛！' : 'AG 遗憾落败。') + (r.mvp ? ' MVP：' + r.mvp + '。' : '') + '去对话里和大帅聊聊这场比赛吧。';
  } else if (S.today.kind === 'match') desc = '今天的比赛结果还没宣布——在对话里告诉大帅（比如「赢了 3:1」），系统会自动记录战绩。';
  else if (S.today.kind === 'train') desc = '训练日：练配合、复盘、加练。今天在训练基地，可以找大帅聊聊战术——或者别的。';
  else if (S.today.kind === 'off') desc = '休赛期自由日：休息、直播、或者……约他出去？';
  document.getElementById('tDesc').textContent = desc;

  var chips = document.getElementById('tChips');
  chips.innerHTML = '';
  function chip(txt, cls){ var s=document.createElement('span'); s.className='chip'+(cls?' '+cls:''); s.textContent=txt; chips.appendChild(s); }
  chip('战绩 ' + S.record.win + '胜 ' + S.record.loss + '负' + (S.record.streak ? ' · ' + S.record.streak + '连胜' : ''));
  chip('情感阶段 ' + (S.stage_names[S.stage] || S.stage), 'gold');
  if (S.next_match) chip('下一场 ' + S.next_match.date + ' vs ' + S.next_match.opponent);

  var mb = document.getElementById('modeBadge');
  mb.textContent = S.mode === 'override' ? '自由跳转' : '跟随现实';
  mb.className = 'mode-badge' + (S.mode === 'override' ? ' override' : '');
  document.getElementById('todayBtn').disabled = S.mode !== 'override';

  /* 今日剧情指引（折叠）：今天能演什么、大帅处于什么状态，点开看全文 */
  var card = document.getElementById('todayCard');
  var oldGuide = card.querySelector('details');
  if (oldGuide) oldGuide.remove();
  if (S.guide) {
    var det = document.createElement('details');
    var sum = document.createElement('summary');
    sum.textContent = '今日剧情指引';
    var gb = document.createElement('div');
    gb.className = 'guide-body';
    gb.textContent = S.guide;
    det.appendChild(sum);
    det.appendChild(gb);
    card.appendChild(det);
  }
}

function renderStages(){
  var bar = document.getElementById('stagesBar');
  bar.innerHTML = '';
  (D.stages || []).forEach(function(st){
    var d = document.createElement('div');
    var t = st.type;
    d.className = 'st-' + (t === 'off' ? 'off' : (t === 'final' ? 'final' : (t === 'arena' ? 'arena' : (t === 'playoff' ? 'playoff' : 'regular'))));
    d.title = st.name + '（' + st.start + ' ~ ' + st.end + '）';
    d.textContent = st.name.replace('常规赛', '').replace('总决赛', '总决赛');
    bar.appendChild(d);
  });
}

/* 日历渲染 */
function matchMeta(ds){
  var m = null;
  (D.matches || []).forEach(function(x){ if (x.date === ds) m = x; });
  return m;
}
function eventMeta(ds){
  var e = null;
  (D.events || []).forEach(function(x){ if (x.date === ds) e = x; });
  return e;
}

function renderCal(){
  if (!D.stages) return;
  var cal = document.getElementById('cal');
  var label = document.getElementById('ymLabel');
  var vd = S ? S.virtual_date : null;
  var todayDS = vd;
  var y = viewMonth.y, m = viewMonth.m;
  label.textContent = y + ' 年 ' + m + ' 月';
  cal.innerHTML = '';
  ['一','二','三','四','五','六','日'].forEach(function(w){
    var d = document.createElement('div'); d.className='wd'; d.textContent = w; cal.appendChild(d);
  });
  var first = new Date(y, m-1, 1);
  var lead = (first.getDay() + 6) % 7;  /* 周一开头 */
  var daysIn = new Date(y, m, 0).getDate();
  var nowKey = dateKey(new Date());

  function stageTypeOf(ds){
    for (var i=0;i<D.stages.length;i++){
      var st = D.stages[i];
      if (ds >= st.start && ds <= st.end) return st.type;
    }
    return ds < D.stages[0].start ? 'prelude' : 'none';
  }

  for (var i=0;i<lead;i++){
    var e=document.createElement('div'); e.className='day empty'; cal.appendChild(e);
  }
  for (var day=1; day<=daysIn; day++){
    var ds = y + '-' + pad(m) + '-' + pad(day);
    var cell = document.createElement('button');
    cell.className = 'day';
    var st = stageTypeOf(ds);
    var mm = matchMeta(ds), ev = eventMeta(ds);
    var isPast = ds < todayDS || (S && S.mode === 'override' && ds === todayDS);

    if (st === 'off') cell.classList.add('off');
    if (mm) {
      cell.classList.add('match');
      /* 未晋级的取消场在 story_kpl2027 里带着 result.win=false，不先分流的话
         日历会把「场次取消」画成一堆凭空多出来的败局 */
      var cancelled = mm.status === 'skipped'
        || (mm.result && mm.result.score && mm.result.score.indexOf('-') === 0);
      if (mm.status === 'played' && mm.result) {
        cell.classList.add(mm.result.win ? 'win' : 'loss');
        if (cancelled) cell.classList.add('skipped');
      } else if (mm.status === 'skipped') {
        cell.classList.add('skipped');
      }
    } else if (ev) {
      cell.classList.add('event');
    }
    if (ds === todayDS) cell.classList.add('today');
    else if (isPast) cell.classList.add('past');

    var dn = document.createElement('span');
    dn.className = 'dn';
    dn.textContent = day;
    cell.appendChild(dn);

    if (mm) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = cancelled ? ('取消 ' + mm.opponent)
        : mm.result ? (mm.result.win ? '胜' : '负') + ' ' + mm.opponent : 'vs ' + mm.opponent;
      cell.appendChild(tag);
      if (mm.result && mm.result.score && mm.result.score.indexOf('-') !== 0) {
        var res = document.createElement('span');
        res.className = 'res ' + (mm.result.win ? 'w' : 'l');
        res.textContent = mm.result.score;
        cell.appendChild(res);
      }
    } else if (ev) {
      var tag2 = document.createElement('span');
      tag2.className = 'tag';
      tag2.textContent = ev.type === 'variety' ? '团综' : (ev.type === 'retire' ? '退役' : (ev.type === 'join' ? '入队' : (ev.type === 'award' ? '颁奖' : '活动')));
      cell.appendChild(tag2);
    } else if (st === 'off') {
      var tag3 = document.createElement('span');
      tag3.className = 'tag';
      tag3.textContent = '休赛';
      cell.appendChild(tag3);
    }

    (function(ds2, mm2, ev2){
      cell.addEventListener('click', function(){
        /* 已记录的场次与取消场都弹详情（回看赛果/撤销口误/看「未晋级」说明），
           取消场只给日期跳转的话，用户点上去完全不知道这场为什么没了 */
        if (mm2 && mm2.result && (mm2.status === 'played' || mm2.status === 'skipped')) { openMatchModal(mm2); return; }
        if (ds2 === todayDS && S && S.mode === 'follow') { toast('这就是当前剧情日'); return; }
        var label2 = mm2 ? ('比赛日 vs ' + mm2.opponent) : (ev2 ? ev2.title : '跳转到 ' + ds2);
        if (ds2 < todayDS || (S && S.mode === 'override' && ds2 === todayDS)) {
          /* 跳回过去 = 回看，直接跳 */
          doJump(ds2);
          return;
        }
        if (confirm('跳到 ' + ds2 + '（' + label2 + '）？\n剧情将停留在此日期，直到你点「回到今天」。')) doJump(ds2);
      });
    })(ds, mm, ev);
    cal.appendChild(cell);
  }
}

function doJump(ds){
  API.post('/api/story/jump', { date: ds }).then(function(s){
    /* 服务端已经跳成功了：这里的任何抛错都不能再报「跳转失败」，
       否则用户以为没跳、反复点，而剧情时钟其实一直在动 */
    try {
      S = s;
      toast('已跳转到 ' + s.virtual_date);
      var vd = (s && s.virtual_date) || (S && S.virtual_date) || '';
      if (vd.length >= 7) viewMonth = { y: parseInt(vd.slice(0, 4)), m: parseInt(vd.slice(5, 7)) };
      renderAll();
    } catch (e2) {
      toast('已跳转，但界面刷新失败：' + e2.message + '（切月或重开本页可恢复）');
    }
  }).catch(function(e){ toast('跳转失败：' + e.message); });
}

function renderStats(){
  var row = document.getElementById('statsRow');
  row.innerHTML = '';
  var items = [
    { k:'胜场', v:S.record.win, cls:'win' },
    { k:'负场', v:S.record.loss, cls:'loss' },
    { k:'当前连胜', v:S.record.streak ? S.record.streak + ' 场' : '—' },
    { k:'情感阶段', v:S.stage_names[S.stage] || S.stage, cls:'stage' }
  ];
  items.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'stat ' + (it.cls || '');
    d.innerHTML = '<div class="v">' + it.v + '</div><div class="k">' + it.k + '</div>';
    row.appendChild(d);
  });
}

function renderAll(){
  renderToday();
  renderStages();
  renderCal();
  renderStats();
  renderLog();
}

/* ---------- 剧情时间线 ---------- */
function renderLog(){
  var box = document.getElementById('logList');
  if (!box) return;
  box.innerHTML = '';
  var logs = (S && S.log) || [];
  if (!logs.length) {
    box.innerHTML = '<div class="log-empty">还没有剧情记录——在对话里宣布第一场比赛结果（如「赢了 3:1」），故事就开始了。</div>';
    return;
  }
  var stageEv = { stage_1:1, stage_2:1, stage_3:1, first_fight:1, command_win:1, confession:1 };
  logs.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'log-item' + (stageEv[it.event] ? ' stage' : '');
    var ld = document.createElement('span');
    ld.className = 'ld';
    ld.textContent = (it.date || '').slice(5);
    var lt = document.createElement('span');
    lt.className = 'lt';
    lt.textContent = it.detail || it.event;
    d.appendChild(ld);
    d.appendChild(lt);
    box.appendChild(d);
  });
}

/* ---------- 赛果详情弹层（含撤销） ---------- */
var _modalMatch = null, _modalReturnFocus = null;
function stageNameOf(key){
  for (var i = 0; i < (D.stages || []).length; i++) {
    if (D.stages[i].key === key) return D.stages[i].name;
  }
  return key || '';
}
function openMatchModal(mm){
  _modalMatch = mm;
  var r = mm.result || {};
  document.getElementById('mTitle').textContent = mm.date + ' vs ' + mm.opponent;
  var body = document.getElementById('mBody');
  body.innerHTML = '';
  function row(k, v){
    var d = document.createElement('div');
    d.className = 'row2';
    var a = document.createElement('span'); a.textContent = k;
    var b = document.createElement('span'); b.textContent = v;
    d.appendChild(a); d.appendChild(b);
    body.appendChild(d);
  }
  row('赛段', stageNameOf(mm.stage) + (mm.label && mm.label !== stageNameOf(mm.stage) ? ' · ' + mm.label : ''));
  row('赛制', mm.bo || '-');
  var cancelled = (r.score === '-');
  row('结果', cancelled ? '取消（未晋级）' : ((r.win ? '胜 ' : '负 ') + (r.score || '')));
  if (!cancelled) {
    if (r.mvp) row('MVP', r.mvp);
    if (r.note) row('备注', r.note);
    row('宣布方式', '对话中由岚风宣布');
  }
  var undoBtn = document.getElementById('mUndo');
  undoBtn.style.display = cancelled ? 'none' : '';
  undoBtn.disabled = false;
  undoBtn.textContent = '撤销这个结果';
  _modalReturnFocus = document.activeElement;
  document.getElementById('modalMask').classList.add('show');
  setTimeout(function(){ document.getElementById('mClose').focus(); }, 30);
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('show');
  _modalMatch = null;
  var ret = _modalReturnFocus; _modalReturnFocus = null;
  if (ret && ret.focus){ try { ret.focus(); } catch (e2) {} }
}
function reloadAll(){
  return Promise.all([API.get('/api/story/calendar'), API.get('/api/story/status')]).then(function(rs){
    D = rs[0]; S = rs[1];
    renderAll();
  });
}
document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('modalMask').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
document.getElementById('mJump').addEventListener('click', function(){
  if (!_modalMatch) return;
  var ds = _modalMatch.date;
  closeModal();
  if (S && S.virtual_date === ds) { toast('剧情就在这天'); return; }
  doJump(ds);
});
document.getElementById('mUndo').addEventListener('click', function(){
  if (!_modalMatch) return;
  var mm = _modalMatch;
  var btn = this;
  if (!confirm('撤销 ' + mm.date + ' vs ' + mm.opponent + ' 的结果？\n场次会回到「待宣布」，战绩与后续受影响场次将重算。')) return;
  btn.disabled = true;
  btn.textContent = '撤销中…';
  API.post('/api/story/result/undo', { date: mm.date }).then(function(s){
    S = s;
    closeModal();
    toast('已撤销，战绩已重算');
    /* 撤销在服务端已经成功了：重拉/重绘失败不能再冒泡成「撤销失败」 */
    return reloadAll().catch(function(e2){ toast('已撤销，但界面刷新失败：' + e2.message); });
  }).catch(function(e){
    btn.disabled = false;
    btn.textContent = '撤销这个结果';
    toast('撤销失败：' + e.message);
  });
});

/* 月份导航 */
function mountMonth(delta){
  viewMonth.m += delta;
  if (viewMonth.m < 1) { viewMonth.m = 12; viewMonth.y--; }
  if (viewMonth.m > 12) { viewMonth.m = 1; viewMonth.y++; }
  if (viewMonth.y < 2026 || (viewMonth.y === 2026 && viewMonth.m < 8)) { viewMonth.y = 2026; viewMonth.m = 8; toast('最早可回看 2026 年 8 月'); }
  if (viewMonth.y > 2027) { viewMonth.y = 2027; viewMonth.m = 12; toast('最远到 2027 年 12 月'); }
  renderCal();
}

document.getElementById('prevM').addEventListener('click', function(){ mountMonth(-1); });
document.getElementById('nextM').addEventListener('click', function(){ mountMonth(1); });
document.getElementById('todayBtn').addEventListener('click', function(){
  API.post('/api/story/resume', {}).then(function(s){
    S = s;
    toast('已回到现实同步：' + s.virtual_date);
    viewMonth = { y: parseInt(s.virtual_date.slice(0,4)), m: parseInt(s.virtual_date.slice(5,7)) };
    renderAll();
  }).catch(function(e){ toast('操作失败：' + e.message); });
});

/* 初始化 */
function initStory(){
  return Promise.all([API.get('/api/story/calendar'), API.get('/api/story/status')]).then(function(rs){
    D = rs[0]; S = rs[1];
    var vd = S.virtual_date || '';
    if (vd.length >= 7) viewMonth = { y: parseInt(vd.slice(0,4)), m: parseInt(vd.slice(5,7)) };
    renderAll();
  });
}
/* 失败要写进自己的节点：原来直接 .wrap.innerHTML = 提示，会把 #cal / #todayCard /
   #statsRow / #logList 一并抹掉，之后任何渲染都拿不到容器；而隧道下
   「HTML 顶替 JSON」这类失败恰恰是首次访问最常见的路径。 */
function showLoadError(e){
  var box = document.getElementById('loadError');
  if (!box) {
    box = document.createElement('div');
    box.id = 'loadError';
    box.className = 'loading';
    document.body.appendChild(box);
  }
  box.textContent = '加载失败：' + ((e && e.message) || e)
    + '（请确认当前角色为「大帅·2027」，并在聊天页登录）';
  var btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '重试';
  btn.addEventListener('click', function(){
    box.remove();
    initStory().catch(showLoadError);
  });
  box.appendChild(document.createElement('br'));
  box.appendChild(btn);
}
initStory().catch(showLoadError);
</script>
